name: New Scanner prematch 1X2 snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 8-22 * * *'

permissions:
  contents: read

concurrency:
  group: new-scanner-prematch-odds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Determine UTC schedule date
        id: schedule_day
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore daily fixture schedule
        uses: actions/cache@v4
        with:
          path: .cache/scanner_fixture_schedule.json
          key: match-matrix-kickoffs-${{ steps.schedule_day.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            match-matrix-kickoffs-${{ steps.schedule_day.outputs.date }}-
      - name: Check upcoming fixtures from cache
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          p=Path(".cache/scanner_fixture_schedule.json")
          now=dt.datetime.now(dt.timezone.utc)
          # If today's cache is missing, allow one fixture discovery request.
          active=not p.exists()
          leagues={"comp_3039","comp_8321","comp_8814","comp_5840","comp_4643","comp_0256","comp_3809","comp_8385","comp_8531","comp_6387"}
          if p.exists():
              try:
                  data=json.loads(p.read_text())
                  if data.get("date")!=now.date().isoformat():
                      active=True
                  else:
                      for m in data.get("matches",[]):
                          comp=m.get("competition") or {}
                          cid=str(m.get("competition_id") or (comp.get("id") if isinstance(comp,dict) else "") or "")
                          if cid not in leagues:continue
                          ko=dt.datetime.fromisoformat(str(m.get("utc_date")).replace("Z","+00:00"))
                          if 0 < (ko-now).total_seconds()/60 <= 25:
                              active=True
                              break
              except (ValueError,TypeError,KeyError):
                  active=True
          print("Prematch collection needed:",active)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("run="+str(active).lower()+"\n")
          PY
      - name: Install collector dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install 'requests>=2.31,<3' 'supabase>=2,<3'
      - name: Syntax check
        if: steps.gate.outputs.run == 'true'
        run: python -m py_compile scripts/collect_new_scanner_prematch_odds.py
      - name: Syntax check halftime collector
        if: steps.gate.outputs.run == 'true'
        run: python -m py_compile scripts/collect_match_matrix_halftime_stats.py
      - name: Capture upcoming fixture odds
        if: steps.gate.outputs.run == 'true'
        env:
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/collect_new_scanner_prematch_odds.py
