name: Historical odds sample (20 matches)
on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: 'Number of historical matches to check'
        required: true
        default: '20'
        type: choice
        options: ['20', '100']
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API collector dependencies
        run: python -m pip install 'requests>=2.31,<3' 'supabase>=2,<3'
      - name: Check credentials are configured
        env:
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$STATS_API_KEY" || { echo "Missing STATS_API_KEY secret"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL secret"; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo "Missing SUPABASE_SECRET_KEY secret"; exit 1; }
      - name: Collect historical odds sample
        env:
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/collect_historical_odds.py --limit ${{ inputs.sample_size }}
