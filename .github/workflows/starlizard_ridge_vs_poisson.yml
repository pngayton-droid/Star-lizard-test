
name: PRO STARLIZARD Ridge vs Quasi-Poisson

on:
  workflow_dispatch:

jobs:
  compare-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy supabase

      - name: Verify Python experiment file
        run: |
          test -f starlizard_ridge_vs_poisson.py

      - name: Run ridge versus quasi-Poisson experiment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKTEST_COMPETITION: comp_3039
          BACKTEST_START: '2025-08-01'
          BACKTEST_END: '2026-11-10'
          BACKTEST_MIN_TRAIN: '100'
          BACKTEST_MAX_DATES: '120'
        run: |
          python -u starlizard_ridge_vs_poisson.py
