name: Audit shots on target in Match Matrix
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/test_shots_similarity.py'
      - '.github/workflows/test_shots_similarity.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy supabase
      - name: Compare identical historical fixtures
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u scripts/test_shots_similarity.py
      - name: Save paired test results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/shots_similarity_*.csv
          git diff --cached --quiet || (git commit -m "Save shots-on-target paired Matrix audit" && git push)
