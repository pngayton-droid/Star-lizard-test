name: Audit Asian goal totals
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_asian_goals.py'
      - '.github/workflows/audit_asian_goals.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy supabase
      - name: Chronological Asian goal total pricing test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u scripts/audit_asian_goals.py
      - name: Commit research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/asian_goals_*.csv
          git diff --cached --quiet || (git commit -m "Save Asian goal total pricing audit" && git push)
