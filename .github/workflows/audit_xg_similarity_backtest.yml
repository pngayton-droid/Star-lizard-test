name: Audit xG similarity against no-xG and league baselines
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit_xg_similarity_backtest.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy supabase
      - name: Test historical similarity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u scripts/audit_xg_similarity_backtest.py
      - name: Commit permanent results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/xg_similarity_backtest_*
          git diff --cached --quiet || (git commit -m "Save xG similarity chronological backtest results" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xg-similarity-backtest
          path: research_results/xg_similarity_backtest_*
          if-no-files-found: ignore
