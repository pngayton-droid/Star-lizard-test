name: FINAL Matrix market offset test
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_matrix_final_offset.py'
      - '.github/workflows/audit_matrix_final_offset.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy
      - run: python scripts/audit_matrix_final_offset.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/matrix_final_offset_*.csv
          git commit -m "Record final preregistered 1X2 offset results" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
