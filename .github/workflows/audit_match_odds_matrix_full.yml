name: Chronological Match Matrix 1X2 match odds backtest
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_match_odds_matrix_full.py'
      - '.github/workflows/audit_match_odds_matrix_full.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy supabase
      - name: Backtest 1X2 match odds with original Matrix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u scripts/audit_match_odds_matrix_full.py
      - name: Save backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/match_odds_matrix_full_*.csv
          git diff --cached --quiet || (git commit -m "Save chronological 1X2 match odds Matrix results" && git push)
