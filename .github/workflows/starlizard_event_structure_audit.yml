
name: PRO STARLIZARD Event Structure Audit

on:
  workflow_dispatch:

jobs:
  event-structure-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Verify audit file
        run: |
          test -f starlizard_event_structure_audit.py

      - name: Inspect goals corners and cards event structures
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -u starlizard_event_structure_audit.py
