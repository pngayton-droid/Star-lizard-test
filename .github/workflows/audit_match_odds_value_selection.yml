name: Diagnose Match Matrix value selection
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_match_odds_value_selection.py'
      - '.github/workflows/audit_match_odds_value_selection.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/audit_match_odds_value_selection.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/match_odds_value_selection_diagnostic.csv
          git commit -m "Save Matrix selection-bias diagnostic" || exit 0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
