name: Reprice Serie A Poisson H2H
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reprice_serie_a_poisson_h2h.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy supabase
      - name: Generate corrected odds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u research/poisson_serie_a_repricing.py
