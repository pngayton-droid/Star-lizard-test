name: Matrix first-goal trading 60 70 80 audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_match_odds_first_goal_trade.py'
      - '.github/workflows/audit_match_odds_first_goal_trade.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy supabase
      - name: Audit first-goal trading outcomes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u scripts/audit_match_odds_first_goal_trade.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/match_odds_first_goal_trade_*.csv
          if ! git diff --cached --quiet; then
            git commit -m "Save Matrix first-goal trading audit"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            exit 1
          fi
