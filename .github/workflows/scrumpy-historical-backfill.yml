name: Scrumpy historical full backfill
on:
  push:
    paths:
      - .github/workflows/scrumpy-historical-backfill.yml
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
concurrency:
  group: scrumpy-historical-backfill
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Collect historical data safely
        env:
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RUN_REQUEST_LIMIT: '60'
          MIN_REMAINING: '350'
        run: python scripts/collect_full_historical.py
