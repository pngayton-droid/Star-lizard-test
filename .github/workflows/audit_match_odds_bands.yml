name: Match odds and trading odds band audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_match_odds_bands.py'
      - '.github/workflows/audit_match_odds_bands.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python -u scripts/audit_match_odds_bands.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/match_odds_band_*.csv
          if ! git diff --cached --quiet; then
            git commit -m "Save match odds price-band audit"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            exit 1
          fi
