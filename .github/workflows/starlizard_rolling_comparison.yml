
name: PRO STARLIZARD Rolling Model Comparison

on:
  workflow_dispatch:

jobs:
  rolling-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy supabase

      - name: Verify experiment files
        run: |
          test -f starlizard_rolling_comparison.py
          test -f starlizard_ridge_vs_poisson.py
          test -f starlizard_pricing_engine.py
          test -f starlizard_walkforward_backtest.py

      - name: Run rolling historical comparison
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKTEST_COMPETITION: comp_3039
          BACKTEST_START: '2024-08-01'
          BACKTEST_END: '2026-11-10'
          BACKTEST_MIN_TRAIN: '100'
          BACKTEST_MAX_DATES: '0'
          ROLLING_START: '2024-08-01'
          ROLLING_MAX_DATES: '0'
        run: |
          python -u starlizard_rolling_comparison.py
