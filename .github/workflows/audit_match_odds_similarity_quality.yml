name: Test Matrix league and opponent-strength similarity
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_match_odds_similarity_quality.py'
      - '.github/workflows/audit_match_odds_similarity_quality.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy supabase scikit-learn
      - name: Evaluate strictly historical neighbours
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u scripts/audit_match_odds_similarity_quality.py
      - name: Commit research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/match_odds_similarity_quality_*.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save league and strength Matrix audit"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
