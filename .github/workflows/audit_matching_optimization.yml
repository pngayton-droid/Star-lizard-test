name: Audit optimal historical match sample size
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit_matching_optimization.yml'
      - 'scripts/audit_matching_optimization.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy supabase
      - name: Test sample sizes by market and period
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u scripts/audit_matching_optimization.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/matching_optimization_*
          git diff --cached --quiet || (git commit -m "Save matching optimization audit" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matching-optimization
          path: research_results/matching_optimization_*
          if-no-files-found: ignore
