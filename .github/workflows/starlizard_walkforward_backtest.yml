
name: PRO STARLIZARD Walk-Forward Backtest

on:
  workflow_dispatch:

jobs:
  walkforward-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas supabase

      - name: Run historical backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKTEST_COMPETITION: comp_3039
          BACKTEST_START: '2025-08-01'
          BACKTEST_END: '2026-11-10'
          BACKTEST_MIN_TRAIN: '100'
          BACKTEST_MAX_DATES: '120'
        run: |
          python -u starlizard_walkforward_backtest.py
