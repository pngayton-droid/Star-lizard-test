
name: PRO STARLIZARD Unified Pricing

on:
  workflow_dispatch:

jobs:
  unified-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Verify pricing engine exists
        run: |
          test -f starlizard_unified_pricing.py

      - name: Run unified historical pricing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -u starlizard_unified_pricing.py
