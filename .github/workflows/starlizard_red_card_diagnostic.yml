
name: PRO STARLIZARD Red Card Diagnostic

on:
  workflow_dispatch:

jobs:
  red-card-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Verify diagnostic file
        run: |
          test -f starlizard_red_card_diagnostic.py

      - name: Investigate red card data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -u starlizard_red_card_diagnostic.py
