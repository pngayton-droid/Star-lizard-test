name: Collect new completed fixtures (10 leagues)
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
permissions:
  contents: read
concurrency:
  group: completed-fixtures-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - run: python -m py_compile scripts/collect_new_completed_fixtures.py
      - name: Collect only missing completed fixture data
        run: python scripts/collect_new_completed_fixtures.py
        env:
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COLLECTOR_REQUEST_CAP: '120'
          COLLECTOR_QUOTA_RESERVE: '500'
