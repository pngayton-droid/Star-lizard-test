name: Serie A venue H2H fair odds
on:
  push:
    branches: [main]
    paths: ['.github/workflows/serie_a_h2h_prices.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy supabase
      - name: Price with five year venue head-to-head
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u research/serie_a_h2h_prices.py
