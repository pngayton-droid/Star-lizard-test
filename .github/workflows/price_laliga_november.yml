name: Price La Liga November fixtures with opponent-adjusted xG
on:
  push:
    branches: [main]
    paths: ['.github/workflows/price_laliga_november.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase numpy
      - name: Calculate independent fair odds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python research/price_laliga_2026_11_20.py
