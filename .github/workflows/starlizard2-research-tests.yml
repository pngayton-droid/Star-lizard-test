name: Starlizard 2 research checks
on:
  push:
    branches: [starlizard-2-existing-data-only]
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile starlizard_2.py research/chronological_validation.py research/conditional_model.py tests/test_chronological_validation.py tests/test_conditional_model.py
      - name: Pure research unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  streamlit-startup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Start headless preview server
        run: |
          streamlit run starlizard_2.py --server.headless true --server.port 8501 > /tmp/starlizard-streamlit.log 2>&1 &
          echo $! > /tmp/starlizard-streamlit.pid
      - name: Wait for Streamlit health endpoint
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep -q ok; then
              echo "Streamlit HTTP startup successful"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/starlizard-streamlit.log
          exit 1
      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/starlizard-streamlit.pid ]; then kill "$(cat /tmp/starlizard-streamlit.pid)" || true; fi
