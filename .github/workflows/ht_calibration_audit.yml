name: Halftime calibration audit

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_ht_calibration_predictions.py
      - scripts/audit_halftime_calibration.py
      - scripts/retrain_ht_chronological_audit.py
      - .github/workflows/ht_calibration_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m py_compile scripts/generate_ht_calibration_predictions.py scripts/audit_halftime_calibration.py scripts/retrain_ht_chronological_audit.py
      - name: Install runtime dependencies
        run: pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scikit-learn==1.5.2' 'joblib==1.4.2' 'requests==2.32.3'
      - name: Check database secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SECRET_KEY" || (echo "Missing SUPABASE_SECRET_KEY secret" && exit 1)
      - name: Generate chronological retrospective predictions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/retrain_ht_chronological_audit.py
      - name: Audit probability bands
        run: python scripts/audit_halftime_calibration.py --input research_results/ht_calibration_predictions.csv
      - name: Upload predictions and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halftime-calibration-audit
          path: |
            research_results/ht_calibration_predictions.csv
            research_results/ht_calibration_audit.csv
          if-no-files-found: warn
