name: Dynamic attack defence holdout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['research/dynamic_attack_defence_holdout.py','.github/workflows/dynamic_attack_defence_holdout.yml']
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        league: [comp_3039, comp_8814, comp_0256, comp_5840]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy supabase
      - name: Chronological model validation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEAGUE_ID: ${{ matrix.league }}
        run: python -u research/dynamic_attack_defence_holdout.py
