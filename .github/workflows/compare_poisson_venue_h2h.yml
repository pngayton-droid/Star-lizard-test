name: Compare Poisson and venue H2H
on:
  push:
    branches: [main]
    paths: ['.github/workflows/compare_poisson_venue_h2h.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy supabase
      - name: Forward holdout model comparison
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u research/compare_poisson_venue_h2h.py
