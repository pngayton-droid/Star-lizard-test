name: Import historical archive (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch archive from private Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen
          from pathlib import Path
          url = os.environ.get("SUPABASE_URL", "").rstrip("/")
          secret = os.environ.get("SUPABASE_SECRET_KEY", "")
          if not url.startswith("https://") or not secret:
              raise SystemExit("Missing Supabase API secrets")
          uri = url + "/storage/v1/object/starlizard-private-import/starlizard_import_ready.zip"
          req = Request(uri, headers={"apikey": secret})
          with urlopen(req, timeout=90) as response:
              data = response.read()
          if len(data) > 10 * 1024 * 1024:
              raise SystemExit("Unexpected archive size")
          Path("data").mkdir(exist_ok=True)
          Path("data/starlizard_import_ready.zip").write_bytes(data)
          print("Private archive downloaded:", len(data), "bytes")
          PY
      - name: Import historical archive using Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/import_historical_archive_api.py data/starlizard_import_ready.zip
