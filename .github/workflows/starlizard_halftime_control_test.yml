
name: PRO STARLIZARD Halftime Control Test

on:
  workflow_dispatch:

jobs:
  halftime-control-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas supabase

      - name: Verify test file
        run: |
          test -f starlizard_halftime_control_test.py

      - name: Run halftime control group comparison
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -u starlizard_halftime_control_test.py
