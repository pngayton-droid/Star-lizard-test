name: Published football pricing models holdout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/published_models_holdout.yml', 'research/published_models_holdout.py']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        league: [comp_3039, comp_8814, comp_0256, comp_5840]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy scikit-learn supabase
      - name: Compare three independent probability models
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEAGUE_ID: ${{ matrix.league }}
        run: python -u research/published_models_holdout.py
