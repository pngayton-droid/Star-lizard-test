name: Fill missing bookmaker odds across match history
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starlizard-recent-odds
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Collect available bookmaker odds for recent matches
        env:
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/collect_historical_odds.py --limit 15000 --max-new 100 --interval 1.3
