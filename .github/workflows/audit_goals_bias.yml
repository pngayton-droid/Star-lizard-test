name: Audit goals probability bias by year
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit_goals_bias.yml'
      - 'scripts/audit_goals_bias.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/audit_goals_bias.py
      - name: Save findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/goals_bias_by_year.csv research_results/goals_bias_overall.csv
          git diff --cached --quiet || (git commit -m "Save goals calibration by year" && git push)
