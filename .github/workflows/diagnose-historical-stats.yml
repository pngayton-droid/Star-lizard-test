name: Diagnose historical stats availability
on:
  push:
    paths:
      - .github/workflows/diagnose-historical-stats.yml
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Inspect one 2021 fixture stats payload
        env:
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/diagnose_older_stats.py
